name: Build and Deploy Donation Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate donation data
        run: |
          node -e "const fs=require('fs'); const p='data/donation.json'; const d=JSON.parse(fs.readFileSync(p,'utf8')); if(!Number.isFinite(d.goal)||d.goal<=0) throw new Error('goal must be a positive number'); if(!Number.isFinite(d.raised)||d.raised<0) throw new Error('raised must be a non-negative number'); if(d.raised>d.goal) console.warn('Warning: raised is greater than goal'); console.log('Donation data OK:', d);"

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R index.html donate.html thank-you.html script.js styles.css data _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
